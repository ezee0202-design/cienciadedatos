<!DOCTYPE html>
<html>
<head>
    <title>Test Regression API</title>
</head>
<body>
    <h1>Test Regression Prediction</h1>
    <button onclick="testPrediction()">Test Prediction</button>
    <pre id="result"></pre>

    <script>
        async function testPrediction() {
            const data = {
                anos_experiencia: 5,
                antiguedad_empresa: 2,
                anos_puesto: 1.5,
                personas_cargo: 0,
                edad: 28,
                trabajo_de: "Developer",
                seniority: "Semi-Senior",
                dedicacion: "Full-Time",
                donde_trabajando: "Argentina",
                modalidad: "Remoto",
                tamano_org: "11-50",
                estudios: "Universitario en curso",
                genero: "Masculino",
                uso_ia: "3",
                recibe_bono: "No"
            };

            try {
                const response = await fetch('http://localhost:5000/api/predict-salary', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });

                const result = await response.json();
                document.getElementById('result').textContent = JSON.stringify(result, null, 2);
            } catch (error) {
                document.getElementById('result').textContent = 'Error: ' + error.message;
            }
        }
    </script>
</body>
</html>
